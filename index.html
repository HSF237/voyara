<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Voyara keeps your travel plan working — even when the weather, the crowd, or your friends change their minds."
    />
    <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1113" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Voyara — the plan that keeps working</title>
    <!-- Applies the saved theme, language and direction before first paint. -->
    <script src="/boot.js"></script>
    <!-- The opening screen: drawn by the browser before any JavaScript arrives,
         and matched by the app's own page loader so the hand-over is seamless. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #f7f5f0;
        transition: opacity 0.35s ease, visibility 0.35s;
      }
      .dark #splash {
        background: #0e1113;
      }
      #splash.done {
        opacity: 0;
        visibility: hidden;
      }
      #splash svg {
        width: 72px;
        height: 72px;
        overflow: visible;
      }
      #splash .tile {
        fill: #1f6f5c;
      }
      .dark #splash .tile {
        fill: #4fb39a;
      }
      #splash .mark {
        fill: none;
        stroke: #fff;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 62;
        stroke-dashoffset: 62;
        animation: splash-draw 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .dark #splash .mark {
        stroke: #0e1113;
      }
      #splash .dot {
        fill: #e2a23b;
        transform-origin: 32px 17px;
        animation: splash-dot 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      #splash .ring {
        fill: none;
        stroke: #1f6f5c;
        stroke-width: 1.5;
        stroke-dasharray: 3 9;
        stroke-linecap: round;
        opacity: 0.45;
        transform-origin: 32px 32px;
        animation: splash-spin 9s linear infinite;
      }
      .dark #splash .ring {
        stroke: #4fb39a;
      }
      @keyframes splash-draw {
        0% { stroke-dashoffset: 62; }
        55%, 85% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -62; }
      }
      @keyframes splash-dot {
        0%, 40% { transform: scale(0); }
        60%, 85% { transform: scale(1); }
        100% { transform: scale(0); }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .mark { animation: none; stroke-dashoffset: 0; }
        #splash .dot, #splash .ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <circle class="ring" cx="32" cy="32" r="46" />
        <rect class="tile" width="64" height="64" rx="16" />
        <path class="mark" d="M17 20l15 26 15-26" />
        <circle class="dot" cx="32" cy="17" r="4.5" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
